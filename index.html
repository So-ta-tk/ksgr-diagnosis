<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>16タイプ性癖診断</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="home-nav">
  <a href="./characters/characters.html" class="home-nav__link">
    ▶---- キャラクター一覧
  </a>

  <a href="./credits/credits.html" class="home-nav__link">
    ▶---- クレジット
  </a>
</nav>
  <main class="container">
 
    <!-- ① スタート画面 -->
    <section id="start-screen" class="screen active">
      <div class="hero">
        <p class="hero__label">SEIHEKI DIAGNOSIS</p>
        <h1 class="hero__title">16タイプ<br>KSGR診断</h1>
        <p class="hero__lead">
          くすぐり界隈向け。<br>
          いくつかの質問に答えると、あなたのタイプが診断されます。
        </p>
      </div>
 
      <div class="panel">
        <p class="panel__prompt">&gt; 診断を開始しますか？<span class="cursor" aria-hidden="true"></span></p>
        <button type="button" class="main-button" data-goto="choice-screen">
          [ 診断をはじめる ]
        </button>
      </div>
 
      <p class="note">NOT FOR MINORS</p>
    </section>
 
 
    <!-- ② 役割選択画面 -->
    <section id="choice-screen" class="screen">

      <div class="hero">
        <h2 class="heading">あなたの立場は？</h2>
        <p class="hero__lead">当てはまるものを選んでください。</p>
 
        <div class="choices">
          <button type="button" class="choice-button" data-role="ぐり" aria-pressed="false">ぐり</button>
          <button type="button" class="choice-button" data-role="ぐら" aria-pressed="false">ぐら</button>
          <button type="button" class="choice-button" data-role="両方" aria-pressed="false">両方</button>
        </div>
      </div>
 
      <div class="actions">
        <button type="button" class="main-button" id="next-button" disabled>次へ</button>
        <button type="button" class="home-button" data-goto="start-screen">Homeへ戻る</button>
      </div>
    </section>
 
 
    <!-- ③ 質問画面 -->
    <section id="question-screen" class="screen">
      <div class="hero">
        <h2 class="heading">質問</h2>
 
        <div class="question-placeholder">
          <p id="question-number"></p>
          <p id="question-text"></p>
        </div>
 
        <p id="selected-role" class="selected-role"></p>
        <!-- 選択肢を表示する場所 -->
        <div id="question-choices" class="question-options"></div>
        <button id="prev-question-button" type="button">
          ← 前の質問へ
        </button>
      </div>
 
      <div class="actions">
        <button type="button" class="home-button" data-goto="start-screen">Homeへ戻る</button>
      </div>
    </section>
 
  </main>
 
  <script type="module" src="main.ts"></script>
</body>
</html>
