<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>診断結果</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style_result.css">
</head>
<body>
  <main class="result-page">

    <!--
      ① カード部分。画像として書き出すのは #result-card の中だけ(1200 x 675)。
      表示のときは .card-frame が画面の幅に合わせて縮小する(CSSだけで動く)。
      画像にするときは縮小を外して書き出す(例: html-to-image の style: { transform: "none" })。
      カードの中身は result.ts が差し込む。ここに書いてある文字・数値は、
      診断データがないときに表示される見本。
    -->
    <div class="card-frame">
      <div class="stage" id="result-card">
        <article class="card">

          <div class="card__main">

            <!-- 左: キャラクター -->
            <div class="card__left">
              <!--
                ドット絵キャラの枠(256x256 などを拡大して表示する想定)。
                画像ができたら、次の <div class="character"> ごと下の1行に置き換える:
                <img class="character__img" id="card-character" src="./image/makebead-256x256.png" alt="小悪魔な恋人のキャラクター">
              -->
                <!-- <img class="character__img" id="card-character" src="./image/SPRD.png" alt="小悪魔な恋人のキャラクター"> -->
              <div class="character" id="card-character">
                <span class="character__label">ドット絵キャラ</span>
                <span class="character__size">256 x 256</span>
              </div>
            </div>

            <!-- 右: 頭文字・タイプ名・4軸 -->
            <div class="card__right">

              <!-- 頭文字(上から、関係性・進め方・源泉・主導権の順) -->
              <div class="letters" id="card-letters">
                <div class="letter" data-letter="relation">
                  <span class="letter__initial" data-field="initial"></span>
                  <span class="letter__word" data-field="word"></span>
                </div>
                <div class="letter" data-letter="playstyle">
                  <span class="letter__initial" data-field="initial"></span>
                  <span class="letter__word" data-field="word"></span>
                </div>
                <div class="letter" data-letter="focus">
                  <span class="letter__initial" data-field="initial"></span>
                  <span class="letter__word" data-field="word"></span>
                </div>
                <div class="letter" data-letter="initiative">
                  <span class="letter__initial" data-field="initial"></span>
                  <span class="letter__word" data-field="word"></span>
                </div>
              </div>

              <!-- タイプ名と一行の説明 -->
              <div class="card__title">
                <div class="card__name-row">
                  <h1 class="card__name" id="card-name" style="--name-chars: 6"></h1>
                  <span class="card__role" id="card-role"></span>
                </div>
                <p class="card__catch" id="card-catch"></p>
              </div>

              <!--
                4軸の棒グラフ。左が「前の極」、右が「後の極」。
                data-win が勝った側(left / right)。棒の長さ・数値・言葉は result.ts が入れる。
              -->
              <div class="axes">
                <div class="axis" data-axis="relation" data-win="left">
                  <div class="axis__labels">
                    <span class="axis__pole axis__pole--left">
                      <span data-field="left">甘い</span>
                      <span class="axis__pct" data-field="pct-left"></span>
                    </span>
                    <span class="axis__pole axis__pole--right">
                      <span class="axis__pct" data-field="pct-right"></span>
                      <span data-field="right">ドライ</span>
                    </span>
                  </div>
                  <div class="axis__bar">
                    <div class="axis__fill axis__fill--left" data-field="bar-left" style="width: 94%"></div>
                    <div class="axis__fill axis__fill--right" data-field="bar-right" style="width: 6%"></div>
                  </div>
                </div>

                <div class="axis" data-axis="playstyle" data-win="right">
                  <div class="axis__labels">
                    <span class="axis__pole axis__pole--left">
                      <span data-field="left">展開</span>
                      <span class="axis__pct" data-field="pct-left"></span>
                    </span>
                    <span class="axis__pole axis__pole--right">
                      <span class="axis__pct" data-field="pct-right"></span>
                      <span data-field="right">じっくり</span>
                    </span>
                  </div>
                  <div class="axis__bar">
                    <div class="axis__fill axis__fill--left" data-field="bar-left" style="width: 0%"></div>
                    <div class="axis__fill axis__fill--right" data-field="bar-right" style="width: 100%"></div>
                  </div>
                </div>

                <div class="axis" data-axis="focus" data-win="left">
                  <div class="axis__labels">
                    <span class="axis__pole axis__pole--left">
                      <span data-field="left">反応</span>
                      <span class="axis__pct" data-field="pct-left"></span>
                    </span>
                    <span class="axis__pole axis__pole--right">
                      <span class="axis__pct" data-field="pct-right"></span>
                      <span data-field="right">感覚</span>
                    </span>
                  </div>
                  <div class="axis__bar">
                    <div class="axis__fill axis__fill--left" data-field="bar-left" style="width: 96%"></div>
                    <div class="axis__fill axis__fill--right" data-field="bar-right" style="width: 4%"></div>
                  </div>
                </div>

                <div class="axis" data-axis="initiative" data-win="left">
                  <div class="axis__labels">
                    <span class="axis__pole axis__pole--left">
                      <span data-field="left">支配</span>
                      <span class="axis__pct" data-field="pct-left"></span>
                    </span>
                    <span class="axis__pole axis__pole--right">
                      <span class="axis__pct" data-field="pct-right"></span>
                      <span data-field="right">従順</span>
                    </span>
                  </div>
                  <div class="axis__bar">
                    <div class="axis__fill axis__fill--left" data-field="bar-left" style="width: 95%"></div>
                    <div class="axis__fill axis__fill--right" data-field="bar-right" style="width: 5%"></div>
                  </div>
                </div>
              </div>

            </div>
          </div>

          <footer class="card__footer">
            <span>16Type-KSGR-Diagnosis</span>
            <span>[サイトURLを入れる]</span>
          </footer>

        </article>
      </div>
    </div>

    <!-- ② 画像の保存・共有ボタン(動作はまだ付けていない) -->
    <div class="actions">
      <button type="button" class="button" id="save-button">画像を保存（まだ使えない）</button>
      <!-- 共有メニューが使えるブラウザのときだけ、TypeScript で hidden を外す -->
      <button type="button" class="button" id="share-button" hidden>Xに共有（まだ使えない）</button>
    </div>

    <!-- ③ タイプの特徴の説明(画像には入らない。短く) -->
    <section class="description">
      <h2 class="description__heading">このタイプの特徴</h2>
      <!-- 仮の文章。タイプごとの説明文に差し替える -->
      <p class="description__text" id="description-text">
        (例)　相手の反応を見るのが何より好きで、場の主導権を自然に握るタイプ。甘い空気の中でいたずらを仕掛け、次々と反応を引き出していきます。
      </p>
    </section>

    <div class="actions">
      <button type="button" class="button button--sub" id="retry-button">もう一度診断する</button>
    </div>

  </main>
  <script type="module" src="result.ts"></script>
</body>
</html>
